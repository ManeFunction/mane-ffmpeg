name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so a tag can't ship with failing tests

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup comes with the runner images, so no third-party toolchain action is needed.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      # The ffmpeg integration tests and the libmpv preview tests skip themselves without these, so they run on
      # Linux only (apt is quick; a brew install on macOS would add minutes to every run).
      - name: Install ffmpeg and libmpv
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libmpv2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run the tests
        run: cargo test --workspace --locked
