version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Skip releases younger than a week: compromised releases are usually
    # caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      # GitHub's own actions go in one PR; a third-party action would get its
      # own PR so its diff gets read.
      github-actions:
        patterns: ["actions/*"]

  # Rust crates in Cargo.lock. Minor and patch bumps share one PR; a major bump gets its own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]
