[package]
name = "mane-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
libc = "0.2"
thiserror = "2"
sha2 = "0.10"
sha1 = "0.10"
ureq = { version = "3", features = ["json"] }
rand = "0.9"
regex = "1"

[dev-dependencies]
tempfile = "3"
regex = "1"
